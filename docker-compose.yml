version: '3'

services:
  db:
    image: postgres:14.3
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${pass}
      POSTGRES_DB: ${name}
    container_name: ocso_db
    volumes:
      - ./postgres:/var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${accessKeyBucket}
      MINIO_ROOT_PASSWORD: ${secretKeyBucket}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data